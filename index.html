<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>strtch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=JetBrains+Mono:wght@400&family=Patrick+Hand&display=swap">
<style>
/* Layout: phone = one column + bottom tabs; desktop (>=900px) = sidebar + wide content. Timer hides both for focus.
   Single cozy light theme on purpose: cream paper, brown ink, clay and olive accents. */
:root {
  --cream: #F3EBDD; --paper: #FBF7EF; --sand: #E8DBC5; --line: #D8C7AB;
  --ink: #3A2F25; --ink-soft: #7A6956; --clay: #B5694A; --clay-soft: #F0DACA;
  --olive: #6E7647; --olive-soft: #E4E1C9; --bark: #4A3B2E; --on-dark: #F7EFE2;
  --f-hand: 'Gaegu', 'Patrick Hand', 'Comic Sans MS', cursive;
  --f-body: 'Patrick Hand', 'Gaegu', 'Comic Sans MS', cursive;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.4; font-synthesis: none; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--clay); outline-offset: 3px; border-radius: 6px; }
svg { flex-shrink: 0; }

/* ---------- shell ---------- */
.app { min-height: 100vh; }
.side { display: none; }
.main { padding-block: 22px 120px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.view { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: space-around; background: var(--paper); border-top: 1.5px solid var(--line);
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 14px; color: var(--ink-soft); font-size: 15px; }
.tab svg { width: 24px; height: 24px; }
.tab.on { color: var(--clay); }
.app.focus .tabs, .app.focus .side { display: none !important; }
.app.focus .main { padding-bottom: 24px; }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: 250px minmax(0, 1fr); }
  .tabs { display: none; }
  .side { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 0; height: 100vh; padding: 34px 22px 28px; border-right: 1.5px solid var(--line); background: var(--paper); }
  .logo { font-family: var(--f-hand); font-weight: 700; font-size: 46px; line-height: 1; margin: 0 0 2px 8px; color: var(--ink); }
  .logo-line { width: 110px; height: 12px; margin: 0 0 26px 10px; color: var(--clay); }
  .nav { display: flex; align-items: center; gap: 12px; background: none; border: 0; border-radius: 14px; padding: 10px 12px; font-size: 19px; color: var(--ink-soft); text-align: left; }
  .nav svg { width: 24px; height: 24px; }
  .nav:hover { background: var(--cream); }
  .nav.on { background: var(--cream); color: var(--ink); }
  .side-note { margin-top: auto; font-size: 15px; color: var(--ink-soft); padding: 0 10px; display: flex; flex-direction: column; gap: 6px; }
  .side-note svg { width: 44px; height: 44px; color: var(--olive); }
  .main { padding-block: 44px 56px; padding-left: 48px; padding-right: max(48px, env(safe-area-inset-right, 0px)); }
  .view { max-width: 1040px; margin: 0; }
  .app.focus { grid-template-columns: minmax(0, 1fr); }
  .app.focus .main { padding: 32px 48px; }
  .app.focus .view { max-width: 1120px; margin: 0 auto; }
}

/* ---------- type + bits ---------- */
.eyebrow { font-size: 16px; color: var(--ink-soft); margin: 0; }
.hero { font-family: var(--f-hand); font-weight: 700; font-size: 46px; line-height: .95; margin: 4px 0 10px; text-wrap: balance; }
.hero .mark { position: relative; display: inline-block; }
.hero .mark svg { position: absolute; left: -2%; bottom: -6px; width: 104%; height: 14px; color: var(--clay); }
.sub { margin: 0 0 22px; color: var(--ink-soft); max-width: 34ch; font-size: 18px; }
.h2 { font-family: var(--f-hand); font-weight: 700; font-size: 25px; margin: 30px 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.h2 small { font-family: var(--f-body); font-weight: 400; font-size: 15px; color: var(--ink-soft); }
.back { align-self: flex-start; background: none; border: 0; display: inline-flex; align-items: center; gap: 6px; color: var(--ink-soft); padding: 0 0 12px; font-size: 17px; }
.back svg { width: 18px; height: 18px; }
.btn { border: 0; border-radius: 16px; font-family: var(--f-hand); font-weight: 700; font-size: 21px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; transition: transform .12s; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn-main { background: var(--ink); color: var(--on-dark); box-shadow: 3px 3px 0 var(--clay); }
.btn-main[disabled] { opacity: .45; cursor: default; }
.btn-soft { background: var(--paper); color: var(--ink); border: 1.5px solid var(--ink); }
.btn-soft[disabled] { opacity: .45; cursor: default; border-color: var(--line); }
.btn-wide { width: 100%; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.btn { white-space: nowrap; }
.actions > #startBtn { flex-basis: 100%; }
@media (min-width: 900px) { .actions > #startBtn { flex: 0 0 auto; } .actions > .btn { flex: 0 0 auto; } }
.soon { font-family: var(--f-body); font-weight: 400; font-size: 14px; color: var(--ink-soft); }

/* ---------- home ---------- */
.home-top { display: grid; gap: 22px; }
.weekcard { display: none; }
@media (min-width: 900px) {
  .home-top { grid-template-columns: minmax(0, 1fr) 330px; align-items: start; }
  .home-top .hero { font-size: 64px; }
  .home-top .row { max-width: 520px; }
  .weekcard { display: block; background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px 20px; }
}
.rgrid { display: flex; flex-direction: column; gap: 12px; }
.rcard { background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 14px; text-align: left; width: 100%; transition: border-color .15s, transform .12s; }
.rcard:hover { border-color: var(--ink-soft); }
.rcard:active { transform: scale(.985); }
.fig { width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.fig svg { width: 34px; height: 34px; }
.tint-sage { background: var(--olive-soft); } .tint-clay { background: var(--clay-soft); }
.rmeta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.rname { font-family: var(--f-hand); font-weight: 700; font-size: 22px; line-height: 1.1; }
.rsub { font-size: 15px; color: var(--ink-soft); }
.rposes { display: none; }
.go { width: 34px; height: 34px; border-radius: 999px; border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center; }
.go svg { width: 16px; height: 16px; }
@media (min-width: 900px) {
  .rgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .rcard { flex-direction: column; align-items: stretch; padding: 18px; gap: 12px; }
  .rcard .fig { width: 100%; height: 132px; border-radius: 16px; }
  .rcard .fig svg { width: 92px; height: 92px; }
  .rposes { display: block; font-size: 15px; color: var(--ink-soft); line-height: 1.35; }
  .rcard .go { display: none; }
  .rstart { display: inline-flex !important; }
}
.rstart { display: none !important; align-self: flex-start; font-family: var(--f-hand); font-weight: 700; font-size: 19px; gap: 6px; align-items: center; color: var(--clay); }
.rstart svg { width: 16px; height: 16px; }
.empty { border: 1.5px dashed var(--line); border-radius: 18px; padding: 22px; text-align: center; color: var(--ink-soft); }

/* week dots (shared) */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; color: var(--ink-soft); }
.dot { width: 32px; height: 32px; border-radius: 999px; border: 1.5px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--on-dark); }
.dot svg { width: 16px; height: 16px; }
.day.on .dot { background: var(--olive); border-color: var(--olive); }
.day.today span { color: var(--clay); }
.day.today .dot { border-color: var(--clay); border-width: 2px; }
.minihead { font-family: var(--f-hand); font-weight: 700; font-size: 22px; margin: 0; }
.ministreak { display: flex; align-items: baseline; gap: 8px; margin-top: 10px; color: var(--ink-soft); font-size: 16px; }
.ministreak b { font-family: var(--f-hand); font-size: 34px; color: var(--clay); font-weight: 700; line-height: 1; }

/* ---------- timer ---------- */
.tview { max-width: 1120px; }
.tbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.tbar .back { padding: 0; }
.tname { font-family: var(--f-hand); font-weight: 700; font-size: 20px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcount { display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 16px; }
.mute { width: 38px; height: 38px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--ink); padding: 0; }
.mute svg { width: 20px; height: 20px; }
.mute[aria-pressed="false"] { border-color: var(--line); color: var(--ink-soft); }
.track { height: 8px; background: var(--sand); border-radius: 999px; margin: 14px 0 0; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--olive); border-radius: 999px; }
.tbody { display: grid; gap: 28px; }
.stage { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 22px; }
.ring { position: relative; width: min(250px, 70vw); aspect-ratio: 1; max-width: 100%; }
.ring > svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring-bg { fill: none; stroke: var(--sand); stroke-width: 9; }
.ring-fg { fill: none; stroke: var(--clay); stroke-width: 9; stroke-linecap: round; }
.ring-fig { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink); }
.ring-fig svg { width: 42%; height: 42%; }
.pname { font-family: var(--f-hand); font-weight: 700; font-size: 40px; line-height: 1; margin: 18px 0 2px; }
.pcue { margin: 0; color: var(--ink-soft); font-size: 18px; }
.clock { font-family: var(--f-hand); font-weight: 700; font-size: 64px; line-height: 1; margin: 12px 0 0; display: flex; justify-content: center; }
.clock span { display: inline-block; width: .52em; text-align: center; }
.clock span.c { width: .28em; }
.pnext { margin-top: 10px; font-size: 16px; color: var(--ink-soft); background: var(--paper); border: 1.5px solid var(--line); padding: 3px 14px; border-radius: 999px; }
.ctrls { display: flex; justify-content: center; align-items: flex-start; gap: 28px; margin-top: 26px; }
.ccol { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; color: var(--ink-soft); }
.cbtn { width: 54px; height: 54px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--ink); }
.cbtn svg { width: 22px; height: 22px; }
.spacer { width: 54px; visibility: hidden; }
.cmain { width: 76px; height: 76px; background: var(--ink); color: var(--on-dark); border: 0; box-shadow: 3px 3px 0 var(--clay); }
.cmain svg { width: 28px; height: 28px; }
.uplist { display: none; }
@media (min-width: 900px) {
  .tbody { grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  .ring { width: 340px; }
  .pname { font-size: 54px; }
  .clock { font-size: 84px; }
  .uplist { display: block; background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px 18px 8px; margin-top: 22px; }
}
.up { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1.5px solid var(--sand); }
.up:last-child { border-bottom: 0; }
.up .fig { width: 40px; height: 40px; border-radius: 12px; }
.up .fig svg { width: 26px; height: 26px; }
.up-name { flex: 1; min-width: 0; font-size: 17px; }
.up-t { font-size: 15px; color: var(--ink-soft); }
.up.done .up-name { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--line); }
.up.now .up-name { font-family: var(--f-hand); font-weight: 700; font-size: 20px; color: var(--clay); }

/* ---------- complete ---------- */
.done-view { align-items: center; text-align: center; padding-top: 6vh; max-width: 520px; margin: 0 auto; }
.badge { width: 104px; height: 104px; border-radius: 999px; background: var(--clay-soft); display: flex; align-items: center; justify-content: center; color: var(--clay); margin-bottom: 14px; }
.badge svg { width: 54px; height: 54px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; margin: 20px 0; }
.stat { background: var(--paper); border: 1.5px solid var(--line); border-radius: 16px; padding: 12px 6px; display: flex; flex-direction: column; }
.stat b { font-family: var(--f-hand); font-weight: 700; font-size: 32px; line-height: 1.1; }
.stat span { font-size: 14px; color: var(--ink-soft); }
.stack { display: flex; flex-direction: column; gap: 10px; width: 100%; }

/* ---------- progress ---------- */
.pgrid { display: grid; gap: 18px; }
.pleft { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px; padding: 18px 20px; }
.streak { background: var(--bark); color: var(--on-dark); border-radius: 20px; padding: 18px 20px; display: flex; align-items: center; gap: 16px; }
.streak b { font-family: var(--f-hand); font-weight: 700; font-size: 58px; line-height: .9; }
.streak span { font-size: 17px; line-height: 1.35; }
.totals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.totals .card b { font-family: var(--f-hand); font-weight: 700; font-size: 34px; display: block; line-height: 1.1; }
.totals .card span { font-size: 15px; color: var(--ink-soft); }
.hrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1.5px solid var(--sand); }
.hrow:last-child { border-bottom: 0; }
.hrow .fig { width: 42px; height: 42px; border-radius: 12px; }
.hrow .fig svg { width: 28px; height: 28px; }
.hname { font-family: var(--f-hand); font-weight: 700; font-size: 20px; line-height: 1.1; }
.hwhen { font-size: 15px; color: var(--ink-soft); }
@media (min-width: 900px) {
  .pgrid { grid-template-columns: 360px minmax(0, 1fr); align-items: start; }
  
}

/* ---------- create + data ---------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label, .lbl { font-family: var(--f-hand); font-weight: 700; font-size: 20px; }
.input { border: 1.5px solid var(--line); background: var(--paper); border-radius: 14px; padding: 10px 14px; font-size: 18px; }
.input:focus { border-color: var(--ink); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px 4px 6px; display: inline-flex; align-items: center; gap: 4px; font-size: 16px; }
.chip:hover { border-color: var(--ink); }
.chip svg { width: 24px; height: 24px; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.prow { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px 8px; }
.prow .fig { width: 36px; height: 36px; border-radius: 10px; }
.prow .fig svg { width: 24px; height: 24px; }
.prow .n { flex: 1; min-width: 0; font-size: 17px; }
.prow { flex-wrap: wrap; }
.prow .vin { flex: 1 1 100%; width: auto; text-align: left; font-size: 16px; padding: 5px 10px; }
.prow input { width: 64px; border: 1.5px solid var(--line); border-radius: 10px; padding: 4px 8px; text-align: right; background: var(--cream); font-size: 17px; }
.x { border: 0; background: none; color: var(--ink-soft); font-size: 22px; line-height: 1; padding: 2px 6px; }
.err { color: var(--clay); min-height: 22px; font-size: 16px; }
.create-view { max-width: 640px; }
.data-view { max-width: 820px; }
textarea.json { width: 100%; min-height: 360px; resize: vertical; background: var(--paper); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px; font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; white-space: pre; overflow: auto; tab-size: 2; color: var(--ink); }
.msg { font-size: 16px; margin-top: 10px; }
.msg.bad { color: var(--clay); } .msg.ok { color: var(--olive); }
.msg ul { margin: 4px 0 0; padding-left: 20px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--paper); padding: 5px 14px; font-size: 16px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--on-dark); }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <aside class="side" aria-label="Main menu">
    <div class="logo">strtch</div>
    <svg class="logo-line" viewBox="0 0 110 12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M3 8 C 25 3, 45 10, 62 6 S 95 3, 107 7"/></svg>
    <button type="button" class="nav" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2 12 4.2l8.6 7.1"/><path d="M5.6 10v9.3c0 .5.3.8.8.8h3.8v-5.6h3.7v5.6h3.9c.5 0 .8-.3.8-.8V10"/></svg>Today</button>
    <button type="button" class="nav" data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 3.6v16.9h17.2"/><path d="M7 15.3l4-5 3.2 3.1 5.2-7"/></svg>Progress</button>
    <button type="button" class="nav" data-go="create"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4.5v15M4.6 12.2h14.8"/></svg>New routine</button>
    <div class="side-note">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 42c0-12 1-22 10-30"/><path d="M33 13c-9 0-14 5-13 13 8 0 13-5 13-13z"/><path d="M24 33c-6-1-10-5-10-11 6 0 10 4 10 11z"/></svg>
      <span>Move a little, every day.</span>
    </div>
  </aside>
  <main class="main"><div class="view" id="view"></div></main>
  <nav class="tabs" aria-label="Main menu">
    <button type="button" class="tab" data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2 12 4.2l8.6 7.1"/><path d="M5.6 10v9.3c0 .5.3.8.8.8h3.8v-5.6h3.7v5.6h3.9c.5 0 .8-.3.8-.8V10"/></svg>Today</button>
    <button type="button" class="tab" data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 3.6v16.9h17.2"/><path d="M7 15.3l4-5 3.2 3.1 5.2-7"/></svg>Progress</button>
  </nav>
</div>

<script>
(function () {

  if (canSpeak) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) {} }

  async function lockScreen(on) {
    try { if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); } else if (!on && wake) { await wake.release(); wake = null; } } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', () => { if (run && !document.hidden) { lockScreen(run.running); loop(); } });

  function vTimer() {
    const r = run.r, p = r.poses[run.i], n = r.poses[run.i + 1];
    root.innerHTML = `<div class="tview">
      <div class="tbar"><button type="button" class="back" id="exit">${I.left} Exit</button><div class="tname">${esc(r.name)}</div><div class="tcount">${run.i + 1} of ${r.poses.length}${canSpeak ? `<button type="button" class="mute" id="mute" aria-pressed="${!muted}" aria-label="${muted ? 'Voice off' : 'Voice on'}">${speakerIcon()}</button>` : ''}</div></div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="tbody"><div class="stage">
        <div class="ring"><svg viewBox="0 0 200 200"><circle class="ring-bg" cx="100" cy="100" r="${R}"/><circle class="ring-fg" id="ringFg" cx="100" cy="100" r="${R}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="0"/></svg><div class="ring-fig">${fig(p.pose)}</div></div>
        <h1 class="pname">${esc(p.name)}</h1>${p.cue ? `<p class="pcue">${esc(p.cue)}</p>` : ''}
        <div class="clock" id="clock" role="timer"></div>
        <div class="pnext">${n ? 'Next: ' + esc(n.name) : 'Last pose'}</div>
        <div class="ctrls">
          <div class="ccol spacer" aria-hidden="true"></div>
          <div class="ccol"><button type="button" class="cbtn cmain" id="pp" aria-label="${run.running ? 'Pause' : 'Resume'}">${run.running ? I.pause : I.play}</button><span id="ppl">${run.running ? 'Pause' : 'Resume'}</span></div>
          <div class="ccol"><button type="button" class="cbtn" id="nxt" aria-label="Skip pose">${I.fwd}</button>Skip</div>
        </div></div>
        <aside class="uplist"><p class="minihead">Up next</p>${r.poses.map((q, j) => `<div class="up ${j < run.i ? 'done' : j === run.i ? 'now' : ''}"><span class="fig tint-${r.color}">${fig(q.pose)}</span><span class="up-name">${esc(q.name)}</span><span class="up-t">${fmt(q.secs)}</span></div>`).join('')}</aside>
      </div></div>`;
    $('exit').onclick = () => { stopRun(); go('home'); };
    $('pp').onclick = pauseToggle; $('nxt').onclick = skip; if ($('mute')) $('mute').onclick = toggleMute;
    paint(elapsed());
  }

  /* ---------- complete ---------- */
  function vDone() {
    const e = lastDone || data.history[0]; if (!e) { go('home'); return; }
    const today = data.history.filter(h => dayKey(h.completedAt) === dayKey(new Date())).length;
    root.innerHTML = `<div class="done-view view-inner" style="display:flex;flex-direction:column;align-items:center">
      <div class="badge">${I.bigcheck}</div>
      <h1 class="hero">Nice work!</h1>
      <p class="sub" style="margin:0">You finished ${esc(e.name)}. One more small thing your body will thank you for.</p>
      <div class="stats"><div class="stat"><b>${e.poses}</b><span>poses done</span></div><div class="stat"><b>${fmt(e.secs)}</b><span>time held</span></div><div class="stat"><b>${today}</b><span>today</span></div></div>
      <div class="stack"><button type="button" class="btn btn-main btn-wide" id="hm">Back to today</button><button type="button" class="btn btn-soft btn-wide" id="pg">See progress</button></div></div>`;
    $('hm').onclick = () => go('home'); $('pg').onclick = () => go('progress');
  }

  /* ---------- progress ---------- */
  function vProgress() {
    const w = weekInfo(), nowD = midnight(new Date());
    const when = iso => {
      const d = new Date(iso), diff = Math.round((nowD - midnight(d)) / 864e5), t = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      return diff === 0 ? `Today, ${t}` : diff === 1 ? `Yesterday, ${t}` : diff < 7 ? `${diff} days ago` : d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    };
    const iconFor = h => { const r = data.routines.find(x => x.id === h.routineId); return r ? [r.poses[0].pose, r.color] : ['childspose', 'sage']; };
    root.innerHTML = `<p class="eyebrow">This week · ${w.active} of 7 days</p><h1 class="hero" style="font-size:44px">Your progress</h1>
      <div class="pgrid">
        <div class="pleft"><div class="card">${weekDots(w)}</div>
        <div class="streak"><b>${w.streak}</b><span>${w.streak === 1 ? 'day' : 'days'} in a row. ${w.streak ? 'One more session tomorrow keeps it going.' : 'Finish a routine today to start a streak.'}</span></div>
        <div class="totals"><div class="card"><b>${w.sessions}</b><span>sessions this week</span></div><div class="card"><b>${fmt(w.secs)}</b><span>time this week</span></div></div></div>
        <div class="card hist"><p class="minihead" style="display:flex;justify-content:space-between;align-items:baseline">Recent sessions <small class="soon">${data.history.length} total</small></p>
          ${data.history.length ? data.history.slice(0, 8).map(h => { const [ic, col] = iconFor(h); return `<div class="hrow"><span class="fig tint-${col}">${fig(ic)}</span><div style="min-width:0"><div class="hname">${esc(h.name || 'Routine')}</div><div class="hwhen">${when(h.completedAt)}${h.secs ? ' · ' + fmt(h.secs) : ''}</div></div></div>`; }).join('') : '<div class="empty">No sessions yet. Finish a routine and it shows up here.</div>'}
        </div></div>`;
  }

  /* ---------- your data (JSON) ---------- */
  function vData() {
    root.innerHTML = `<div class="data-view"><p class="eyebrow">For testing</p><h1 class="hero" style="font-size:44px">Your data</h1>
      <p class="sub" style="max-width:60ch">Everything the app knows, as JSON. Edit it and press Apply, or load a .json file.</p>
      <textarea class="json" id="json" spellcheck="false" aria-label="App data as JSON"></textarea>
      <div class="row" style="margin-top:12px">
        <button type="button" class="btn btn-main" id="apply">Apply</button>
        <button type="button" class="btn btn-soft" id="copy">Copy</button>
        <span class="btn btn-soft file">Load file<input type="file" id="fileIn" accept=".json,application/json"></span>
        <button type="button" class="btn btn-soft" id="reset">Reset</button></div>
      <div class="msg" id="msg" role="status"></div>
      <div class="row" id="resetAsk" hidden style="margin-top:10px;align-items:center"><span>Replace everything with the sample data?</span><button type="button" class="btn btn-main" id="resetYes">Reset</button><button type="button" class="btn btn-soft" id="resetNo">Cancel</button></div>
      <h2 class="h2">Timer speed <small>for quick testing</small></h2>
      <div class="seg" id="speed">${[1, 5, 20].map(s => `<button type="button" data-s="${s}" aria-pressed="${s === speed}">${s}×</button>`).join('')}</div></div>`;
    const ta = $('json'); ta.value = JSON.stringify(data, null, 2);
    const msg = (k, h) => { $('msg').className = 'msg ' + k; $('msg').innerHTML = h; };
    const apply = text => {
      let d; try { d = JSON.parse(text); } catch (err) { msg('bad', `The JSON could not be read: ${esc(err.message)}. Look for a missing comma, quote or bracket near that spot.`); return; }
      const errs = validate(d);
      if (errs.length) { msg('bad', `Fix these and apply again:<ul>${errs.slice(0, 8).map(x => `<li>${esc(x)}</li>`).join('')}</ul>`); return; }
      data = normalise(d); save(); ta.value = JSON.stringify(data, null, 2);
      msg('ok', `Applied. ${data.routines.length} routines, ${data.history.length} sessions.`);
    };
    $('apply').onclick = () => apply(ta.value);
    $('copy').onclick = () => { const fb = () => { ta.focus(); ta.select(); msg('', 'Selected. Press Ctrl+C or ⌘C to copy.'); }; try { navigator.clipboard.writeText(ta.value).then(() => msg('ok', 'Copied.'), fb); } catch (e) { fb(); } };
    $('fileIn').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { ta.value = rd.result; apply(rd.result); }; rd.readAsText(f); e.target.value = ''; };
    $('reset').onclick = () => { $('resetAsk').hidden = false; };
    $('resetNo').onclick = () => { $('resetAsk').hidden = true; };
    $('resetYes').onclick = () => { $('resetAsk').hidden = true; apply(JSON.stringify(DEFAULT_DATA)); };
    $('speed').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; speed = +b.dataset.s; $('speed').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  }

  const route = () => go(location.hash === '#data' ? 'data' : 'home');
  window.addEventListener('hashchange', () => { if (run) stopRun(); route(); });
  route();
})();
</script>

</body>
</html>
